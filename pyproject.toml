[project]
name = "gemini-transcribe-wrapper"
version = "0.1.5"
description = "CLI and Python API to transcribe videos longer than 30 minutes with gemini-3.5-transcribe while mitigating free-tier 429 errors"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "tayaee" }
]
keywords = [
    "gemini",
    "speech-to-text",
    "stt",
    "transcription",
    "subtitles",
    "srt",
    "diarization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "google-genai>=1.0.0",
    "static-ffmpeg>=2.0.0",
    "filelock>=3.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/tayaee/gemini-transcribe-wrapper"
Repository = "https://github.com/tayaee/gemini-transcribe-wrapper"
"Bug Tracker" = "https://github.com/tayaee/gemini-transcribe-wrapper/issues"

[project.scripts]
gemini-transcribe-wrapper = "gemini_transcribe_wrapper.cli:main"
gtw = "gemini_transcribe_wrapper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "semgrep>=1.0.0",
]

[tool.pyright]
include = ["src"]
# Pydantic v2 model constructors are called with subset of fields relying on
# Field() defaults; pyright reports these as missing required arguments.
reportCallIssue = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_transcribe_wrapper"]
